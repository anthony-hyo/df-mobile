<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>DF Pocket</title>
        <style>
            :root {
                --game-w: 750;
                --game-h: 550;
            }

            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: #530000;
                overflow: hidden;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #stage {
                width: 750px;
                height: 550px;
                flex-shrink: 0;
                transform-origin: center center;
            }

            object, embed {
                width: 750px;
                height: 550px;
                display: block;
            }
        </style>
        <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    </head>
    <body>
        <div id="stage">
            <object id="FFable" classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" codebase="https://fpdownload.macromedia.com/pub/shockwave/cabs/flash/swflash.cab#version=7,0,0,0" width="750" height="550" align="middle">
                <param name="allowScriptAccess" value="sameDomain">
                <param name="movie" value="DFLoader.swf?ver=393831">
                <param name="menu" value="false">
                <param name="allowFullScreen" value="true">
                <param name="flashvars" value="">
                <param name="bgcolor" value="#530000">
                <embed src="https://play.dragonfable.com/game/DFLoader.swf?ver=393831" flashvars="" name="FFable" bgcolor="#530000" menu="false" allowFullScreen="true" width="750" height="550" align="middle" allowScriptAccess="sameDomain" type="application/x-shockwave-flash" pluginspage="https://www.macromedia.com/go/getflashplayer" swLiveConnect="true">
            </object>
        </div>

        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                ...window.RufflePlayer.config,
                urlRewriteRules: [
                    [
                        /^(?:https?:\/\/[^/]+)?\/?(?:game\/)?(.*)$/i,
                        "https://play.dragonfable.com/game/$1",
                    ],
                ],
                
                preferredRenderer: "webgl", 
                quality: "high",
                letterbox: "off",
                splashScreen: false,
                preloader: false,
                scrollingBehavior: "never",
                deviceFontRenderer: "embedded",
                backgroundExecutionMode: "none",
                logLevel: "error",
            };
            
            (function () {
                try {
                    Object.defineProperty(window, "devicePixelRatio", {
                        get: () => 1,
                        configurable: true,
                    });
                } catch (e) {
                    console.warn(e);
                }
                
                const stage = document.getElementById('stage');
                const GAME_W = 750;
                const GAME_H = 550;

                function resize() {
                    const vw = window.innerWidth;
                    const vh = window.innerHeight;
                    const scale = Math.min(vw / GAME_W, vh / GAME_H);
                    stage.style.transform = 'scale(' + scale + ')';
                }

                window.addEventListener('resize', resize);
                window.addEventListener('orientationchange', () => setTimeout(resize, 50));

                resize();
            })();
        </script>
    </body>
</html>
