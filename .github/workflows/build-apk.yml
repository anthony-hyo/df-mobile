name: Build Pocket

on:
    workflow_dispatch:

jobs:
    build-android:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            matrix:
                arch:
                    - armv8
                    - armv7
                    - x86_64

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Java
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Make gradlew executable
                run: chmod +x android/gradlew

            -   name: Build APK
                run: |
                    cd android
                    ./gradlew assembleRelease

            -   name: Rename APK
                run: |
                    mkdir -p build-output
                    cp android/app/build/outputs/apk/release/app-release.apk build-output/df-pocket-${{ matrix.arch }}.apk

            -   name: Upload APK artifact
                uses: actions/upload-artifact@v4
                with:
                    name: apk-${{ matrix.arch }}
                    path: build-output/*.apk

    publish:
        needs: build-android
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Download all APKs
                uses: actions/download-artifact@v4
                with:
                    pattern: apk-*
                    merge-multiple: true
                    path: releases

            -   name: Create Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: v${{ github.run_number }}
                    name: Build ${{ github.run_number }}
                    body: |
                        ## Download DF Pocket
                        
                        ### Android
                        
                        - **armv8** (recommended) - `df-pocket-armv8.apk`
                        - **armv7** (32-bit devices) - `df-pocket-armv7.apk`
                        - **x86_64** (Chrome OS/Emulator) - `df-pocket-x86_64.apk`
                        
                        ---
                        
                        ### Build Info
                        
                        - **Build**: ${{ github.run_number }}
                        - **Built**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                    files: releases/*.apk
